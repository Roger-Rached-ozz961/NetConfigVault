# Local administrator-owned Bash settings. This file is sourced by backup.sh.
# Keep both limits positive. A snapshot is removed if it exceeds either limit.
RETENTION_MAX_VERSIONS=20
RETENTION_MAX_DAYS=30

# Enforce known-host verification; do not change to "no".
SSH_STRICT_HOST_KEY_CHECKING=yes

# Optional path to a separately managed global known_hosts file.
# Leave empty to use OpenSSH defaults and the user's known_hosts.
SSH_GLOBAL_KNOWN_HOSTS_FILE=
